<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PlantCare AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Segoe UI,Arial,sans-serif;
height:100vh;
background:radial-gradient(circle at 20% 20%,#164d2d,#03140b 45%,#010806);
color:white;
display:flex;
align-items:center;
justify-content:center;
}

.ai-wrapper{
width:min(1050px,94vw);
height:min(850px,94vh);
background:rgba(5,25,16,.94);
border:1px solid #35d66b55;
border-radius:28px;
box-shadow:0 0 60px #22c55e22;
display:flex;
flex-direction:column;
overflow:hidden;
}

.ai-header{
height:82px;
padding:15px 25px;
display:flex;
align-items:center;
justify-content:space-between;
background:linear-gradient(90deg,#16a34a44,#052015);
border-bottom:1px solid #4ade8040;
}

.brand{display:flex;align-items:center;gap:14px}

.logo{
width:50px;height:50px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
background:linear-gradient(135deg,#22c55e,#059669);
box-shadow:0 0 25px #22c55e66;
}

h1{font-size:25px}
.subtitle{font-size:13px;color:#9bd8b0;margin-top:3px}

.online{color:#86efac;font-size:14px}
.dot{
display:inline-block;
width:9px;height:9px;
background:#22c55e;
border-radius:50%;
box-shadow:0 0 12px #22c55e;
margin-right:6px;
}

.chat-area{
flex:1;
overflow-y:auto;
padding:30px 45px;
}

.welcome{
height:100%;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.welcome h2{font-size:30px;margin:12px 0}
.welcome p{color:#a7c9b2;font-size:16px;line-height:1.6}
.welcome-icon{font-size:60px}

.message{
display:flex;
margin-bottom:22px;
width:100%;
}

.user{justify-content:flex-end}
.ai{justify-content:flex-start}

.message-content{
max-width:78%;
padding:16px 20px;
border-radius:18px;
font-size:17px;
line-height:1.65;
white-space:normal;
}

.user .message-content{
background:linear-gradient(135deg,#16a34a,#059669);
border-bottom-right-radius:5px;
}

.ai .message-content{
background:#ffffff0d;
border:1px solid #4ade8030;
border-bottom-left-radius:5px;
}

.ai strong{color:#86efac}
.ai h3{color:#86efac;margin:14px 0 6px}

.user-photo{
display:block;
width:230px;
max-width:100%;
border-radius:14px;
margin-bottom:10px;
border:1px solid #ffffff55;
}

.input-section{
padding:18px 28px 22px;
background:#020e08;
border-top:1px solid #4ade8025;
}

.input-box{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
gap:9px;
padding:8px 10px 8px 15px;
border-radius:18px;
background:#ffffff0c;
border:1px solid #4ade8045;
}

#question{
flex:1;
background:transparent;
border:0;
outline:0;
color:white;
font-size:17px;
padding:12px 4px;
resize:none;
font-family:inherit;
}

#question::placeholder{color:#8ba995}

.icon{
width:46px;height:46px;
border:0;border-radius:13px;
background:#22c55e18;
color:white;
font-size:20px;
cursor:pointer;
}

#sendBtn{
width:52px;height:52px;
border:0;border-radius:15px;
background:linear-gradient(135deg,#22c55e,#059669);
color:white;
font-size:22px;
cursor:pointer;
}

#sendBtn:disabled{opacity:.5}

#imageInput{display:none}

.preview{
display:none;
max-width:900px;
margin:0 auto 10px;
position:relative;
}

.preview img{
width:110px;height:110px;
object-fit:cover;
border-radius:14px;
border:1px solid #4ade8060;
}

.remove{
position:absolute;
top:-8px;
left:98px;
width:24px;height:24px;
border:0;border-radius:50%;
background:#ef4444;
color:white;
cursor:pointer;
}

.hint{
text-align:center;
color:#6f8d79;
font-size:12px;
margin-top:8px;
}

.typing{
display:flex;
gap:5px;
}

.typing span{
width:8px;height:8px;
background:#4ade80;
border-radius:50%;
animation:blink 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes blink{
0%,100%{opacity:.3}
50%{opacity:1;transform:translateY(-5px)}
}

@media(max-width:700px){
.ai-wrapper{width:96vw;height:95vh;border-radius:20px}
.chat-area{padding:20px 14px}
.message-content{max-width:90%;font-size:16px}
.online{display:none}
.input-section{padding:12px}
.welcome h2{font-size:24px}
}
</style>
</head>

<body>

<div class="ai-wrapper">

<div class="ai-header">
<div class="brand">
<div class="logo">🌱</div>
<div>
<h1>PlantCare AI</h1>
<div class="subtitle">Smart Plant & Gardening Assistant</div>
</div>
</div>

<div class="online">
<span class="dot"></span>AI Online
</div>
</div>

<div class="chat-area" id="chatArea">

<div class="welcome" id="welcome">
<div>
<div class="welcome-icon">🌿</div>
<h2>Welcome to PlantCare AI</h2>
<p>
Ask anything about plants, gardening, watering,<br>
soil, sunlight, fertilizer, diseases or upload a plant photo.
</p>
</div>
</div>

</div>

<div class="input-section">

<div class="preview" id="preview">
<img id="previewImg">
<button class="remove" onclick="removeImage()">×</button>
</div>

<div class="input-box">

<button class="icon"
onclick="document.getElementById('imageInput').click()">
📷
</button>

<input
type="file"
id="imageInput"
accept="image/jpeg,image/png,image/webp">

<textarea
id="question"
rows="1"
placeholder="Ask PlantCare AI anything..."></textarea>

<button id="sendBtn" onclick="askAI()">➤</button>

</div>

<div class="hint">
PlantCare AI can analyze plant questions and plant photos 🌱
</div>

</div>

</div>

<script>

const chatArea=document.getElementById("chatArea");
const question=document.getElementById("question");
const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const previewImg=document.getElementById("previewImg");
const sendBtn=document.getElementById("sendBtn");

imageInput.addEventListener("change",function(){

const file=this.files[0];

if(!file)return;

previewImg.src=URL.createObjectURL(file);
preview.style.display="block";

});

function removeImage(){

imageInput.value="";
previewImg.src="";
preview.style.display="none";

}

question.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();
askAI();

}

});

function escapeHTML(text){

const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;

}

function formatAnswer(text){

let html=escapeHTML(text);

html=html.replace(
/\*\*(.*?)\*\*/g,
"<strong>$1</strong>"
);

html=html.replace(
/^### (.*)$/gm,
"<h3>$1</h3>"
);

html=html.replace(
/^## (.*)$/gm,
"<h3>$1</h3>"
);

html=html.replace(
/\n/g,
"<br>"
);

return html;

}

function addUserMessage(text,image){

const msg=document.createElement("div");
msg.className="message user";

const box=document.createElement("div");
box.className="message-content";

if(image){

const img=document.createElement("img");
img.className="user-photo";
img.src=URL.createObjectURL(image);
box.appendChild(img);

}

if(text){

const t=document.createElement("div");
t.textContent=text;
box.appendChild(t);

}

msg.appendChild(box);
chatArea.appendChild(msg);

chatArea.scrollTop=chatArea.scrollHeight;

}

function addAIMessage(text){

const msg=document.createElement("div");
msg.className="message ai";

const box=document.createElement("div");
box.className="message-content";

box.innerHTML=formatAnswer(text);

msg.appendChild(box);
chatArea.appendChild(msg);

chatArea.scrollTop=chatArea.scrollHeight;

}

function showTyping(){

const msg=document.createElement("div");
msg.className="message ai";
msg.id="typing";

msg.innerHTML=`
<div class="message-content">
<div class="typing">
<span></span>
<span></span>
<span></span>
</div>
</div>`;

chatArea.appendChild(msg);
chatArea.scrollTop=chatArea.scrollHeight;

}

function removeTyping(){

const t=document.getElementById("typing");
if(t)t.remove();

}

async function askAI(){

const text=question.value.trim();
const image=imageInput.files[0];

if(!text && !image){

question.focus();
return;

}

const welcome=document.getElementById("welcome");
if(welcome)welcome.remove();

addUserMessage(
text || "Please analyze this plant photo 🌱",
image
);

showTyping();

sendBtn.disabled=true;

const formData=new FormData();

formData.append("question",text);

if(image){
formData.append("image",image);
}

question.value="";

try{

const response=await fetch(
"/plant-ai",
{
method:"POST",
body:formData
}
);

const data=await response.json();

removeTyping();

if(data.success){

addAIMessage(data.answer);

}else{

addAIMessage(
data.answer ||
"Sorry, PlantCare AI could not answer."
);

}

}catch(error){

removeTyping();

addAIMessage(
"Unable to connect to PlantCare AI. Please try again."
);

console.error(error);

}

sendBtn.disabled=false;

removeImage();

question.focus();

}

</script>

</body>
</html>
