<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PlantCare Hub - Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>
<div class="card">
    <div class="logo">
        PlantCare <span class="green">Hub</span>
    </div>

    <h1>Create Account</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="{{ 'error' if category in ['error', 'danger'] else 'message' }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% if error %}
        <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" autocomplete="off">
        <!-- Hidden honeypot inputs to trap browser autofill engines -->
        <input type="text" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;" tabindex="-1" autocomplete="off">
        <input type="password" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0;" tabindex="-1" autocomplete="new-password">

        <div class="field">
            <label for="reg_user_fullname">Full Name</label>
            <div class="input-box">
                <input type="text" id="reg_user_fullname" name="reg_user_fullname"
                       placeholder="Enter your full name"
                       value=""
                       autocomplete="off" spellcheck="false" required>
            </div>
        </div>

        <div class="field">
            <label for="reg_user_email">Gmail Address</label>
            <div class="input-box">
                <input type="text" inputmode="email" id="reg_user_email" name="reg_user_email"
                       placeholder="Enter your Gmail address"
                       value=""
                       autocomplete="off" autocapitalize="none" spellcheck="false" required>
            </div>
        </div>

        <div class="field">
            <label for="reg_user_password">Password</label>
            <div class="input-box">
                <input type="password" id="reg_user_password" name="reg_user_password"
                       placeholder="Create password (min. 6 characters)"
                       autocomplete="new-password" minlength="6" required>
            </div>
        </div>

        <div class="field">
            <label for="reg_user_confirm_password">Confirm Password</label>
            <div class="input-box">
                <input type="password" id="reg_user_confirm_password" name="reg_user_confirm_password"
                       placeholder="Confirm your password"
                       autocomplete="new-password" minlength="6" required>
            </div>
        </div>

        <button type="submit" class="register-btn">Create Account →</button>
    </form>

    <div class="bottom">
        Already have an account?
        <a href="/login">Login</a>
    </div>
</div>

<script>
function clearRegisterInputs() {
    ["reg_user_fullname", "reg_user_email", "reg_user_password", "reg_user_confirm_password"].forEach(function(id) {
        const el = document.getElementById(id);
        if (el) el.value = "";
    });
}
document.addEventListener("DOMContentLoaded", function() {
    clearRegisterInputs();
    setTimeout(clearRegisterInputs, 50);
    setTimeout(clearRegisterInputs, 200);
});
window.addEventListener("pageshow", clearRegisterInputs);
</script>
</body>
</html>
