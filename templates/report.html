<!DOCTYPE html>
<html>
<head>
<title>Plant Reports | PlantCare Hub</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f8f5;color:#17251b}
.container{max-width:1100px;margin:50px auto;padding:20px}
h1{text-align:center;margin-bottom:40px}
.reports{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.card{background:white;padding:30px;border-radius:20px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.card h2{margin-bottom:20px}
.btn{display:inline-block;padding:13px 22px;background:#1f7a45;color:white;text-decoration:none;border-radius:10px;font-weight:bold}
.btn:hover{background:#155c32}
@media(max-width:800px){.reports{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>📄 Plant Reports</h1>
<div class="reports">
<div class="card">
<h2>🌿 All Plants</h2>
<p>View all your plants and their complete details.</p>
<a href="/report-view/all" class="btn">View Report</a>
</div>
<div class="card">
<h2>💧 Need Water</h2>
<p>View plants that need watering.</p>
<a href="/report-view/water" class="btn">View Report</a>
</div>
<div class="card">
<h2>🌱 Need Fertilizer</h2>
<p>View plants that need fertilizer.</p>
<a href="/report-view/fertilizer" class="btn">View Report</a>
</div>
</div>
</div>
</body>
</html>
